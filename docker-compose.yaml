services:
  bot:
    profiles: [ "bot" ]
    build: .
    env_file:
      - .env
    develop:
      watch:
        - path: ./src
          target: /app/src
          action: sync
    command: uvicorn src.bot.main:app --reload --host 0.0.0.0 --port 80
    ports:
      - "3000:80"
    volumes:  # ← Заменяем configs на volumes
      - ./config.toml:/app/config.toml
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:80/internal/health" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 5s
      
  bot-migration:
    profiles: [ "infra" ]
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    env_file:
      - .env
    volumes:
      - ./config.toml:/app/config.toml
    restart: on-failure
    command: uv run alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    profiles: [ "infra" ]
    image: postgres:17-alpine
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  postgrest:
    profiles: [ "infra" ]
    image: postgrest/postgrest:latest
    ports:
      - "3001:3000"
    env_file:
      - postgrest.env

volumes:
  postgres_data:
    driver: local
